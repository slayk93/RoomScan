name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler la version debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK en release téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RoomScan build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier aussi en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoomScan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
